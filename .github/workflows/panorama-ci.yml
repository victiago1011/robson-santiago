name: Validar Panorama 360

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Testar editor, datas e termômetro
        run: npm run test:panorama
      - name: Verificar tipos TypeScript
        run: |
          npx next typegen
          npx tsc --noEmit
      - name: Compilar site
        run: npm run build
